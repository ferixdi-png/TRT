name: Deploy AI Boost to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/ai-boost-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ai-boost-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live site
        uses: actions/checkout@v4
        with:
          ref: ai-boost-live
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai-boost-demo
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
