<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kie AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ═══════════════════════════════════════════════════════════════
           PREMIUM DESIGN SYSTEM - Kie AI Mini App
           8px Grid • Premium Typography • Smooth Transitions
        ═══════════════════════════════════════════════════════════════ */
        
        :root {
            /* Telegram Theme Integration */
            --tg-bg: var(--tg-theme-bg-color, #ffffff);
            --tg-text: var(--tg-theme-text-color, #1a1a1a);
            --tg-hint: var(--tg-theme-hint-color, #8e8e93);
            --tg-link: var(--tg-theme-link-color, #007aff);
            --tg-btn: var(--tg-theme-button-color, #007aff);
            --tg-btn-text: var(--tg-theme-button-text-color, #ffffff);
            --tg-secondary: var(--tg-theme-secondary-bg-color, #f2f2f7);
            
            /* Premium Palette */
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            --accent-gradient-hover: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #9333ea 100%);
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.12);
            --warning: #f59e0b;
            --warning-bg: rgba(245, 158, 11, 0.12);
            --error: #ef4444;
            --error-bg: rgba(239, 68, 68, 0.12);
            
            /* Surfaces */
            --surface-elevated: rgba(255, 255, 255, 0.8);
            --surface-overlay: rgba(0, 0, 0, 0.04);
            --glass: rgba(255, 255, 255, 0.72);
            --glass-border: rgba(255, 255, 255, 0.18);
            
            /* Spacing (8px grid) */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;
            --space-10: 40px;
            
            /* Typography */
            --font-display: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            --font-body: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            
            /* Radii */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
            --radius-full: 9999px;
            
            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.3);
            
            /* Transitions */
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
            --duration-fast: 150ms;
            --duration-normal: 250ms;
            --duration-slow: 400ms;
            --duration-slower: 600ms;
        }
        
        /* ═══════════════════════════════════════════════════════════════
           PREMIUM ANIMATIONS & KEYFRAMES
        ═══════════════════════════════════════════════════════════════ */
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        
        @keyframes scaleInBounce {
            0% { opacity: 0; transform: scale(0.3); }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.3); }
            50% { box-shadow: 0 0 40px rgba(99, 102, 241, 0.6); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes ripple {
            0% { transform: scale(0); opacity: 0.5; }
            100% { transform: scale(4); opacity: 0; }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes typewriter {
            from { width: 0; }
            to { width: 100%; }
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1); }
            75% { transform: scale(1.1); }
        }
        
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes countUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Animation utility classes */
        .animate-fade-in { animation: fadeIn var(--duration-normal) var(--ease-out) forwards; }
        .animate-fade-in-up { animation: fadeInUp var(--duration-slow) var(--ease-out) forwards; }
        .animate-fade-in-down { animation: fadeInDown var(--duration-slow) var(--ease-out) forwards; }
        .animate-slide-in-right { animation: slideInRight var(--duration-slow) var(--ease-out) forwards; }
        .animate-slide-in-left { animation: slideInLeft var(--duration-slow) var(--ease-out) forwards; }
        .animate-scale-in { animation: scaleIn var(--duration-normal) var(--ease-spring) forwards; }
        .animate-scale-bounce { animation: scaleInBounce var(--duration-slower) var(--ease-out) forwards; }
        .animate-pulse { animation: pulse 2s ease-in-out infinite; }
        .animate-glow { animation: glow 2s ease-in-out infinite; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-spin { animation: spin 1s linear infinite; }
        .animate-shake { animation: shake 0.5s ease-in-out; }
        .animate-gradient { animation: gradient 3s ease infinite; background-size: 200% 200%; }
        .animate-heartbeat { animation: heartbeat 1.5s ease-in-out infinite; }
        
        /* Stagger delays for list items */
        .stagger-1 { animation-delay: 50ms; }
        .stagger-2 { animation-delay: 100ms; }
        .stagger-3 { animation-delay: 150ms; }
        .stagger-4 { animation-delay: 200ms; }
        .stagger-5 { animation-delay: 250ms; }
        .stagger-6 { animation-delay: 300ms; }
        .stagger-7 { animation-delay: 350ms; }
        .stagger-8 { animation-delay: 400ms; }
        
        /* Dark mode adjustments */
        @media (prefers-color-scheme: dark) {
            :root {
                --surface-elevated: rgba(30, 30, 35, 0.9);
                --surface-overlay: rgba(255, 255, 255, 0.06);
                --glass: rgba(30, 30, 35, 0.85);
                --glass-border: rgba(255, 255, 255, 0.1);
            }
        }
        
        /* ═══════════════════════════════════════════════════════════════
           BASE STYLES
        ═══════════════════════════════════════════════════════════════ */
        
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        html { 
            font-size: 16px; 
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        body {
            font-family: var(--font-body);
            background: var(--tg-bg);
            color: var(--tg-text);
            min-height: 100vh;
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
            line-height: 1.5;
        }
        
        .container { 
            max-width: 100%; 
            padding: 0 var(--space-4);
        }
        
        /* ═══════════════════════════════════════════════════════════════
           TYPOGRAPHY
        ═══════════════════════════════════════════════════════════════ */
        
        .text-display { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.2; }
        .text-title { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.3px; line-height: 1.3; }
        .text-headline { font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }
        .text-body { font-size: 15px; font-weight: 400; }
        .text-caption { font-size: 13px; font-weight: 500; color: var(--tg-hint); }
        .text-micro { font-size: 11px; font-weight: 500; letter-spacing: 0.2px; text-transform: uppercase; color: var(--tg-hint); }
        
        /* ═══════════════════════════════════════════════════════════════
           PAGE HEADER
        ═══════════════════════════════════════════════════════════════ */
        
        .page-header {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-4) 0;
            position: sticky;
            top: 0;
            background: var(--tg-bg);
            z-index: 100;
            margin-bottom: var(--space-2);
        }
        
        .back-btn {
            width: 40px;
            height: 40px;
            background: var(--tg-secondary);
            border: none;
            border-radius: var(--radius-full);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--duration-fast) var(--ease-out);
            color: var(--tg-text);
        }
        
        .back-btn:active { transform: scale(0.92); background: var(--surface-overlay); }
        
        .page-title { 
            font-family: var(--font-display);
            font-size: 20px; 
            font-weight: 600; 
            flex: 1;
            letter-spacing: -0.3px;
        }
        
        /* ═══════════════════════════════════════════════════════════════
           HERO HEADER
        ═══════════════════════════════════════════════════════════════ */
        
        .header {
            background: var(--accent-gradient);
            background-size: 200% 200%;
            animation: gradient 8s ease infinite;
            padding: var(--space-6) var(--space-4) var(--space-8);
            margin: 0 calc(var(--space-4) * -1) var(--space-5);
            border-radius: 0 0 var(--radius-2xl) var(--radius-2xl);
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            pointer-events: none;
            animation: float 6s ease-in-out infinite;
        }
        
        .header::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -20%;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            pointer-events: none;
            animation: float 8s ease-in-out infinite reverse;
        }
        
        .header-top { 
            display: flex; 
            align-items: center; 
            gap: var(--space-4); 
            margin-bottom: var(--space-5);
            position: relative;
        }
        
        .user-avatar {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-full);
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            flex-shrink: 0;
        }
        
        .user-info { flex: 1; min-width: 0; }
        .user-name { font-size: 18px; font-weight: 600; margin-bottom: 2px; }
        .user-username { font-size: 14px; opacity: 0.8; }
        
        /* Balance Card */
        .balance-card {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: var(--radius-xl);
            padding: var(--space-4) var(--space-5);
            display: flex;
            align-items: center;
            gap: var(--space-4);
        }
        
        .balance-icon { 
            font-size: 32px; 
            width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.15);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .balance-info { flex: 1; }
        .balance-label { font-size: 12px; opacity: 0.75; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
        .balance-value { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
        .balance-value .currency { font-size: 16px; opacity: 0.7; margin-left: 2px; }
        
        .balance-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: var(--radius-md);
            padding: var(--space-3) var(--space-4);
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
        }
        
        .balance-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.3); }
        
        /* Free Badge */
        .free-badge {
            margin-top: var(--space-4);
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            gap: var(--space-3);
        }
        
        .free-badge-icon { font-size: 20px; }
        .free-badge-text { font-size: 14px; font-weight: 500; }
        
        /* ═══════════════════════════════════════════════════════════════
           SECTIONS
        ═══════════════════════════════════════════════════════════════ */
        
        .section { margin-bottom: var(--space-6); }
        
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-4);
            padding: 0 var(--space-1);
        }
        
        .section-title { 
            font-family: var(--font-display);
            font-size: 18px; 
            font-weight: 600;
            letter-spacing: -0.2px;
        }
        
        .section-link { 
            font-size: 14px; 
            font-weight: 500;
            color: var(--accent-primary); 
            cursor: pointer;
            transition: opacity var(--duration-fast);
        }
        
        .section-link:active { opacity: 0.7; }
        
        /* ═══════════════════════════════════════════════════════════════
           TOP MODELS SHOWCASE
        ═══════════════════════════════════════════════════════════════ */
        
        .top-models-banner {
            background: var(--accent-gradient);
            background-size: 200% 200%;
            animation: gradient 6s ease infinite;
            border-radius: var(--radius-xl);
            padding: var(--space-5);
            margin-bottom: var(--space-6);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all var(--duration-normal) var(--ease-spring);
            box-shadow: var(--shadow-lg);
        }
        
        .top-models-banner:hover { 
            transform: translateY(-2px) scale(1.01); 
            box-shadow: 0 12px 32px rgba(99, 102, 241, 0.35);
        }
        
        .top-models-banner:active { transform: scale(0.98); }
        
        .top-models-banner::before {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.15) 50%, transparent 60%);
            animation: shimmer 3s infinite;
            pointer-events: none;
        }
        
        .top-models-banner::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 40%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1));
        }
        
        .top-banner-content { position: relative; z-index: 1; color: white; }
        .top-banner-badge { 
            font-size: 12px; 
            font-weight: 600; 
            background: rgba(255,255,255,0.2); 
            padding: 4px 10px; 
            border-radius: var(--radius-full); 
            display: inline-block; 
            margin-bottom: var(--space-2);
            animation: pulse 2s ease-in-out infinite;
        }
        .top-banner-title { font-size: 20px; font-weight: 700; margin-bottom: var(--space-1); }
        .top-banner-desc { font-size: 14px; opacity: 0.85; }
        .top-banner-arrow { 
            position: absolute; 
            right: var(--space-4); 
            top: 50%; 
            transform: translateY(-50%); 
            font-size: 24px; 
            opacity: 0.8;
            animation: slideInRight 0.5s ease-out;
            transition: transform var(--duration-fast) var(--ease-out);
        }
        
        .top-models-banner:hover .top-banner-arrow { transform: translateY(-50%) translateX(4px); }
        
        /* ═══════════════════════════════════════════════════════════════
           CATEGORY CARDS
        ═══════════════════════════════════════════════════════════════ */
        
        .category-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: var(--space-3);
        }
        
        .category-card {
            background: var(--tg-secondary);
            border-radius: var(--radius-lg);
            padding: var(--space-5) var(--space-4);
            cursor: pointer;
            transition: all var(--duration-normal) var(--ease-spring);
            text-align: center;
            position: relative;
            overflow: hidden;
            opacity: 0;
            animation: scaleIn var(--duration-slow) var(--ease-spring) forwards;
        }
        
        .category-card:nth-child(1) { animation-delay: 0ms; }
        .category-card:nth-child(2) { animation-delay: 50ms; }
        .category-card:nth-child(3) { animation-delay: 100ms; }
        .category-card:nth-child(4) { animation-delay: 150ms; }
        .category-card:nth-child(5) { animation-delay: 200ms; }
        .category-card:nth-child(6) { animation-delay: 250ms; }
        
        .category-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--accent-gradient);
            opacity: 0;
            transition: opacity var(--duration-normal);
        }
        
        .category-card:hover { 
            transform: translateY(-4px) scale(1.02); 
            box-shadow: var(--shadow-lg);
        }
        
        .category-card:hover .category-icon { 
            animation: heartbeat 0.6s ease-in-out; 
        }
        
        .category-card:active { transform: scale(0.96); }
        .category-card:active::before { opacity: 0.08; }
        
        .category-icon { 
            font-size: 44px; 
            margin-bottom: var(--space-3);
            position: relative;
            transition: transform var(--duration-normal) var(--ease-spring);
        }
        
        .category-name { 
            font-size: 15px; 
            font-weight: 600; 
            margin-bottom: var(--space-1);
            position: relative;
        }
        
        .category-count { 
            font-size: 13px; 
            color: var(--tg-hint);
            position: relative;
        }
        
        /* ═══════════════════════════════════════════════════════════════
           MODEL LIST & CARDS
        ═══════════════════════════════════════════════════════════════ */
        
        .model-list { 
            display: flex; 
            flex-direction: column; 
            gap: var(--space-3);
        }
        
        .model-item {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            background: var(--tg-secondary);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            cursor: pointer;
            transition: all var(--duration-normal) var(--ease-spring);
            border: 2px solid transparent;
            opacity: 0;
            animation: fadeInUp var(--duration-slow) var(--ease-out) forwards;
        }
        
        .model-item:nth-child(1) { animation-delay: 0ms; }
        .model-item:nth-child(2) { animation-delay: 50ms; }
        .model-item:nth-child(3) { animation-delay: 100ms; }
        .model-item:nth-child(4) { animation-delay: 150ms; }
        .model-item:nth-child(5) { animation-delay: 200ms; }
        .model-item:nth-child(6) { animation-delay: 250ms; }
        .model-item:nth-child(7) { animation-delay: 300ms; }
        .model-item:nth-child(8) { animation-delay: 350ms; }
        
        .model-item:hover { 
            transform: translateX(4px); 
            box-shadow: var(--shadow-md);
            border-color: var(--surface-overlay);
        }
        
        .model-item:hover .model-icon { 
            transform: scale(1.1) rotate(5deg); 
        }
        
        .model-item:hover .model-price {
            transform: scale(1.05);
        }
        
        .model-item:active { transform: scale(0.98); }
        .model-item.featured { 
            border-color: var(--success); 
            background: var(--success-bg);
        }
        .model-item.featured:hover { border-color: var(--success); }
        
        .model-item.top { 
            border-color: var(--accent-primary);
            background: rgba(99, 102, 241, 0.06);
        }
        .model-item.top:hover { border-color: var(--accent-secondary); }
        
        .model-icon { 
            font-size: 36px;
            width: 52px;
            height: 52px;
            background: var(--surface-overlay);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform var(--duration-normal) var(--ease-spring);
        }
        
        .model-info { flex: 1; min-width: 0; }
        
        .model-name { 
            font-size: 16px; 
            font-weight: 600; 
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .model-desc { 
            font-size: 13px; 
            color: var(--tg-hint);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .model-price { 
            font-size: 15px; 
            font-weight: 600; 
            color: var(--accent-primary);
            white-space: nowrap;
        }
        
        .model-price.free { color: var(--success); }
        
        .model-arrow {
            color: var(--tg-hint);
            font-size: 18px;
        }
        
        /* ═══════════════════════════════════════════════════════════════
           MODEL INTRO CARD
        ═══════════════════════════════════════════════════════════════ */
        
        .intro-card {
            background: linear-gradient(135deg, var(--tg-secondary) 0%, var(--surface-overlay) 100%);
            border-radius: var(--radius-xl);
            padding: var(--space-5);
            margin-bottom: var(--space-5);
            border: 1px solid var(--surface-overlay);
        }
        
        .intro-header {
            display: flex;
            align-items: flex-start;
            gap: var(--space-4);
            margin-bottom: var(--space-4);
        }
        
        .intro-icon {
            font-size: 40px;
            width: 64px;
            height: 64px;
            background: var(--accent-gradient);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .intro-title { font-size: 20px; font-weight: 700; margin-bottom: var(--space-1); }
        .intro-subtitle { font-size: 14px; color: var(--tg-hint); line-height: 1.4; }
        
        .intro-features {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }
        
        .intro-feature {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            font-size: 14px;
            color: var(--tg-text);
        }
        
        .intro-feature-icon { color: var(--success); }
        
        /* ═══════════════════════════════════════════════════════════════
           SKU SELECTOR
        ═══════════════════════════════════════════════════════════════ */
        
        .sku-selector {
            margin-bottom: var(--space-5);
        }
        
        .sku-label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: var(--space-3);
            color: var(--tg-text);
        }
        
        .sku-grid {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-2);
        }
        
        .sku-btn {
            padding: var(--space-3) var(--space-4);
            border: 2px solid var(--tg-secondary);
            background: var(--tg-bg);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--duration-normal) var(--ease-spring);
            color: var(--tg-text);
            position: relative;
            overflow: hidden;
        }
        
        .sku-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--accent-gradient);
            opacity: 0;
            transition: opacity var(--duration-normal);
        }
        
        .sku-btn:hover { 
            border-color: var(--accent-primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }
        
        .sku-btn:active { transform: scale(0.95); }
        .sku-btn.active {
            border-color: var(--accent-primary);
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent-primary);
            animation: scaleInBounce 0.3s var(--ease-spring);
        }
        
        .sku-price {
            display: block;
            font-size: 12px;
            color: var(--tg-hint);
            margin-top: 2px;
        }
        
        .sku-btn.active .sku-price { color: var(--accent-primary); }
        
        /* ═══════════════════════════════════════════════════════════════
           PRICE CARD
        ═══════════════════════════════════════════════════════════════ */
        
        .price-card {
            background: var(--tg-secondary);
            border-radius: var(--radius-lg);
            padding: var(--space-4) var(--space-5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-5);
            opacity: 0;
            animation: fadeInUp var(--duration-slow) var(--ease-out) 0.2s forwards;
        }
        
        .price-info { flex: 1; }
        .price-label { font-size: 13px; color: var(--tg-hint); margin-bottom: 2px; }
        .price-balance { font-size: 12px; color: var(--tg-hint); }
        .price-value { 
            font-size: 28px; 
            font-weight: 700; 
            color: var(--accent-primary); 
            letter-spacing: -0.5px;
            transition: all var(--duration-normal) var(--ease-spring);
        }
        .price-value.updating { animation: countUp 0.3s var(--ease-out); }
        .price-value.free { color: var(--success); animation: pulse 2s ease-in-out infinite; }
        
        /* ═══════════════════════════════════════════════════════════════
           FORM ELEMENTS
        ═══════════════════════════════════════════════════════════════ */
        
        .form-group { margin-bottom: var(--space-5); }
        
        .form-label { 
            font-size: 14px; 
            font-weight: 600; 
            margin-bottom: var(--space-3); 
            display: block;
            color: var(--tg-text);
        }
        
        .form-input {
            width: 100%;
            padding: var(--space-4);
            border: 2px solid var(--tg-secondary);
            border-radius: var(--radius-md);
            font-size: 16px;
            font-family: inherit;
            background: var(--tg-bg);
            color: var(--tg-text);
            resize: none;
            transition: border-color var(--duration-fast);
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }
        
        .form-input::placeholder { color: var(--tg-hint); }
        .form-textarea { min-height: 140px; line-height: 1.5; }
        
        /* Image Upload */
        .image-upload-area {
            background: var(--tg-secondary);
            border: 2px dashed var(--tg-hint);
            border-radius: var(--radius-lg);
            padding: var(--space-8) var(--space-4);
            text-align: center;
            cursor: pointer;
            transition: all var(--duration-fast) var(--ease-out);
            color: var(--tg-hint);
        }
        
        .image-upload-area:active {
            border-color: var(--accent-primary);
            background: rgba(99, 102, 241, 0.08);
        }
        
        .upload-icon { font-size: 48px; margin-bottom: var(--space-3); }
        .upload-text { font-size: 15px; font-weight: 500; margin-bottom: var(--space-1); }
        .upload-hint { font-size: 13px; }
        
        /* ═══════════════════════════════════════════════════════════════
           BUTTONS
        ═══════════════════════════════════════════════════════════════ */
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            width: 100%;
            padding: var(--space-4) var(--space-5);
            background: var(--accent-gradient);
            background-size: 200% 200%;
            color: white;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-top: var(--space-4);
            transition: all var(--duration-normal) var(--ease-spring);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.2) 50%, transparent 60%);
            transition: all 0.5s;
            pointer-events: none;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            animation: gradient 3s ease infinite;
        }
        
        .btn:hover::before {
            animation: shimmer 1.5s infinite;
        }
        
        .btn:active { transform: scale(0.98); box-shadow: 0 2px 10px rgba(99, 102, 241, 0.3); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        
        .btn-secondary {
            background: var(--tg-secondary);
            color: var(--tg-text);
            box-shadow: var(--shadow-sm);
        }
        
        .btn-secondary:hover {
            background: var(--surface-overlay);
            box-shadow: var(--shadow-md);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        
        .btn-success:hover {
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
        }
        
        .btn-outline {
            background: transparent;
            border: 2px solid var(--tg-secondary);
            color: var(--tg-text);
            box-shadow: none;
        }
        
        .btn-outline:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            box-shadow: var(--shadow-sm);
        }
        
        /* ═══════════════════════════════════════════════════════════════
           RESULT SCREEN
        ═══════════════════════════════════════════════════════════════ */
        
        .result-card {
            background: var(--tg-secondary);
            border-radius: var(--radius-xl);
            overflow: hidden;
            margin-bottom: var(--space-5);
            box-shadow: var(--shadow-lg);
            opacity: 0;
            animation: scaleInBounce var(--duration-slower) var(--ease-out) forwards;
        }
        
        .result-image {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            display: block;
            animation: fadeIn var(--duration-slow) var(--ease-out) 0.2s backwards;
        }
        
        .result-video {
            width: 100%;
            border-radius: var(--radius-xl);
            display: block;
            animation: fadeIn var(--duration-slow) var(--ease-out) 0.2s backwards;
        }
        
        .result-actions {
            display: flex;
            gap: var(--space-3);
            margin-top: var(--space-4);
        }
        
        .result-btn {
            flex: 1;
            padding: var(--space-4);
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            transition: all var(--duration-fast) var(--ease-out);
            background: var(--accent-gradient);
            color: white;
        }
        
        .result-btn:active { transform: scale(0.96); }
        .result-btn.secondary { background: var(--tg-secondary); color: var(--tg-text); }
        
        /* ═══════════════════════════════════════════════════════════════
           STATUS & LOADING
        ═══════════════════════════════════════════════════════════════ */
        
        .status-card {
            text-align: center;
            padding: var(--space-10) var(--space-5);
            animation: fadeIn var(--duration-slow) var(--ease-out);
        }
        
        .status-spinner {
            width: 64px;
            height: 64px;
            border: 4px solid var(--tg-secondary);
            border-top-color: var(--accent-primary);
            border-radius: var(--radius-full);
            animation: spin 0.8s linear infinite;
            margin: 0 auto var(--space-6);
            position: relative;
        }
        
        .status-spinner::after {
            content: '';
            position: absolute;
            inset: -8px;
            border: 2px solid transparent;
            border-top-color: var(--accent-secondary);
            border-radius: var(--radius-full);
            animation: spin 1.2s linear infinite reverse;
            opacity: 0.5;
        }
        
        .status-icon { 
            font-size: 64px; 
            margin-bottom: var(--space-5);
            animation: scaleInBounce var(--duration-slower) var(--ease-out);
        }
        .status-icon.success { animation: scaleInBounce var(--duration-slower) var(--ease-out), heartbeat 1.5s ease-in-out 0.6s; }
        
        .status-title { 
            font-size: 20px; 
            font-weight: 600; 
            margin-bottom: var(--space-2);
            animation: fadeInUp var(--duration-slow) var(--ease-out) 0.1s backwards;
        }
        .status-text { 
            font-size: 15px; 
            color: var(--tg-hint); 
            line-height: 1.5;
            animation: fadeInUp var(--duration-slow) var(--ease-out) 0.2s backwards;
        }
        .status-id { 
            margin-top: var(--space-5); 
            font-size: 12px; 
            color: var(--tg-hint); 
            font-family: monospace;
            animation: fadeIn var(--duration-slow) var(--ease-out) 0.3s backwards;
        }
        
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            gap: var(--space-4);
            animation: fadeIn var(--duration-slow) var(--ease-out);
        }
        
        .loading-spinner {
            width: 44px;
            height: 44px;
            border: 3px solid var(--tg-secondary);
            border-top-color: var(--accent-primary);
            border-radius: var(--radius-full);
            animation: spin 0.8s linear infinite;
            position: relative;
        }
        
        .loading-spinner::after {
            content: '';
            position: absolute;
            inset: -6px;
            border: 2px solid transparent;
            border-top-color: var(--accent-secondary);
            border-radius: var(--radius-full);
            animation: spin 1.2s linear infinite reverse;
            opacity: 0.4;
        }
        
        .loading-text { 
            color: var(--tg-hint); 
            font-size: 15px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        /* Skeleton */
        .skeleton {
            background: linear-gradient(90deg, var(--tg-secondary) 25%, var(--surface-overlay) 50%, var(--tg-secondary) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-md);
        }
        
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        
        /* ═══════════════════════════════════════════════════════════════
           ERROR STATE
        ═══════════════════════════════════════════════════════════════ */
        
        .error-card {
            background: var(--tg-secondary);
            border-radius: var(--radius-xl);
            padding: var(--space-8) var(--space-5);
            text-align: center;
            margin: var(--space-5) 0;
        }
        
        .error-icon { font-size: 56px; margin-bottom: var(--space-4); }
        .error-title { font-size: 18px; font-weight: 600; margin-bottom: var(--space-2); }
        .error-text { font-size: 14px; color: var(--tg-hint); line-height: 1.5; }
        
        /* ═══════════════════════════════════════════════════════════════
           HISTORY
        ═══════════════════════════════════════════════════════════════ */
        
        .history-item {
            display: flex;
            gap: var(--space-4);
            background: var(--tg-secondary);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            margin-bottom: var(--space-3);
            cursor: pointer;
            transition: transform var(--duration-fast) var(--ease-out);
        }
        
        .history-item:active { transform: scale(0.98); }
        
        .history-thumb {
            width: 64px;
            height: 64px;
            border-radius: var(--radius-md);
            background: var(--surface-overlay);
            object-fit: cover;
            flex-shrink: 0;
        }
        
        .history-info { flex: 1; min-width: 0; }
        .history-model { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
        .history-status { font-size: 13px; color: var(--tg-hint); }
        .history-date { font-size: 12px; color: var(--tg-hint); margin-top: var(--space-1); }
        
        /* ═══════════════════════════════════════════════════════════════
           BOTTOM NAVIGATION
        ═══════════════════════════════════════════════════════════════ */
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            padding: var(--space-2) 0 calc(var(--space-2) + env(safe-area-inset-bottom));
            z-index: 1000;
        }
        
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: var(--space-2);
            cursor: pointer;
            color: var(--tg-hint);
            transition: color var(--duration-fast);
            -webkit-tap-highlight-color: transparent;
        }
        
        .nav-item.active { color: var(--accent-primary); }
        .nav-icon { font-size: 24px; }
        .nav-label { font-size: 11px; font-weight: 500; }
        
        /* ═══════════════════════════════════════════════════════════════
           EMPTY STATE
        ═══════════════════════════════════════════════════════════════ */
        
        .empty-state {
            text-align: center;
            padding: var(--space-10) var(--space-5);
        }
        
        .empty-icon { font-size: 64px; margin-bottom: var(--space-4); opacity: 0.5; }
        .empty-title { font-size: 18px; font-weight: 600; margin-bottom: var(--space-2); }
        .empty-text { font-size: 14px; color: var(--tg-hint); margin-bottom: var(--space-5); }
        
        /* ═══════════════════════════════════════════════════════════════
           SEARCH
        ═══════════════════════════════════════════════════════════════ */
        
        .search-bar {
            position: relative;
            margin-bottom: var(--space-5);
        }
        
        .search-input {
            width: 100%;
            padding: var(--space-4) var(--space-4) var(--space-4) 48px;
            border: 2px solid var(--tg-secondary);
            border-radius: var(--radius-lg);
            font-size: 16px;
            background: var(--tg-secondary);
            color: var(--tg-text);
            transition: all var(--duration-fast);
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            background: var(--tg-bg);
        }
        
        .search-icon {
            position: absolute;
            left: var(--space-4);
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: var(--tg-hint);
        }
        
        /* ═══════════════════════════════════════════════════════════════
           FILTER CHIPS
        ═══════════════════════════════════════════════════════════════ */
        
        .filter-row {
            display: flex;
            gap: var(--space-2);
            overflow-x: auto;
            padding-bottom: var(--space-2);
            margin-bottom: var(--space-4);
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        
        .filter-row::-webkit-scrollbar { display: none; }
        
        .filter-chip {
            padding: var(--space-2) var(--space-4);
            background: var(--tg-secondary);
            border: 2px solid transparent;
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all var(--duration-fast);
            color: var(--tg-text);
        }
        
        .filter-chip.active {
            background: rgba(99, 102, 241, 0.12);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }
        
        .filter-chip:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="container">
        <div id="app">
            <div class="loading">
                <div class="loading-spinner"></div>
                <div class="loading-text">Загрузка...</div>
            </div>
        </div>
    </div>
    
    <div class="bottom-nav" id="bottomNav" style="display:none;">
        <div class="nav-item active" onclick="goHome()">
            <div class="nav-icon">🏠</div>
            <div class="nav-label">Главная</div>
        </div>
        <div class="nav-item" onclick="showTopModels()">
            <div class="nav-icon">🔥</div>
            <div class="nav-label">Топ</div>
        </div>
        <div class="nav-item" onclick="showCategories()">
            <div class="nav-icon">🎨</div>
            <div class="nav-label">Модели</div>
        </div>
        <div class="nav-item" onclick="showHistory()">
            <div class="nav-icon">📋</div>
            <div class="nav-label">История</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        const API_BASE = '/webapp/api';
        let appData = { 
            user: null, 
            balance: 0, 
            freeRemaining: 0, 
            models: [], 
            freeModels: [], 
            categories: {},
            topModels: null,
            topCategories: []
        };
        let navHistory = [];
        let currentJobId = null;
        let pollInterval = null;
        let currentLang = 'ru';
        
        async function apiCall(endpoint, options = {}) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    ...options,
                    headers: { 
                        'X-Telegram-Init-Data': tg.initData || '',
                        'Content-Type': 'application/json',
                        ...options.headers 
                    }
                });
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                return { error: error.message };
            }
        }
        
        function getUser() { return tg.initDataUnsafe?.user || null; }
        function getInitial(name) { return name ? name.charAt(0).toUpperCase() : '?'; }
        
        function groupModelsByType(models) {
            // Map API types (t2i, i2v, etc.) to category keys
            const typeMap = {
                't2i': 'text-to-image',
                'text_to_image': 'text-to-image',
                'text-to-image': 'text-to-image',
                'i2i': 'image-to-image',
                'image_to_image': 'image-to-image',
                'image-to-image': 'image-to-image',
                't2v': 'text-to-video',
                'text_to_video': 'text-to-video',
                'text-to-video': 'text-to-video',
                'i2v': 'image-to-video',
                'image_to_video': 'image-to-video',
                'image-to-video': 'image-to-video',
                'speech_to_video': 'other',
                'lip_sync': 'other',
                'video_editing': 'other',
                'text_to_speech': 'other',
                'text_to_music': 'other',
                'audio': 'other',
                'chat': 'other'
            };
            
            const categories = {
                'text-to-image': { key: 'text-to-image', name: 'Текст → Фото', icon: '🖼️', desc: 'Создайте изображение по описанию', models: [] },
                'image-to-image': { key: 'image-to-image', name: 'Редактор фото', icon: '🧩', desc: 'Измените или улучшите фото', models: [] },
                'text-to-video': { key: 'text-to-video', name: 'Текст → Видео', icon: '🎬', desc: 'Создайте видео по сценарию', models: [] },
                'image-to-video': { key: 'image-to-video', name: 'Фото → Видео', icon: '🎞️', desc: 'Оживите ваше изображение', models: [] },
                'other': { key: 'other', name: 'Другое', icon: '🧰', desc: 'Специальные инструменты', models: [] }
            };
            
            (models || []).forEach(m => {
                const rawType = m.type || 'other';

        async function handleImageSelect(input) {
            const file = input.files[0];
            if (!file) return;
            
            if (file.size > 10 * 1024 * 1024) {
                tg.showAlert('Файл слишком большой. Максимум 10MB.');
                return;
            }
            
            const preview = document.getElementById('imagePreview');
            const placeholder = document.getElementById('uploadPlaceholder');
            const uploadArea = document.getElementById('imageUploadArea');
            
            // Show loading
            placeholder.innerHTML = '<div class="loading-spinner" style="width: 30px; height: 30px;"></div><div style="margin-top: 12px;">Загрузка...</div>';
            
            try {
                // Read file as base64
                const base64 = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
                
                // Upload to server
                const result = await apiCall('/upload', {
                    method: 'POST',
                    body: JSON.stringify({ image: base64 })
                });
                
                if (result.error) {
                    throw new Error(result.error);
                }
                
                // Store URL and show preview
                appData.uploadedImageUrl = result.url;
                preview.src = base64;
                preview.style.display = 'block';
                placeholder.style.display = 'none';
                uploadArea.style.padding = '0';
                uploadArea.style.background = 'transparent';
                
            } catch (e) {
                tg.showAlert('Ошибка загрузки: ' + e.message);
                placeholder.innerHTML = `
                    <div style="font-size: 48px; margin-bottom: 12px;">📷</div>
                    <div>Нажмите чтобы выбрать фото</div>
                `;
            }
        }
        
        async function submitGeneration(event, modelId, requiresImage = false) {
            event.preventDefault();
            
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) {
                tg.showAlert('Введите описание для генерации');
                return;
            }
            
            // Check if image is required but not uploaded
            if (requiresImage && !appData.uploadedImageUrl) {
                tg.showAlert('Загрузите изображение для этой модели');
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Отправка...';
            
            const payload = {
                model_id: modelId,
                prompt: prompt,
                params: {}
            };
            
            // Add image URL if uploaded
            if (appData.uploadedImageUrl) {
                payload.image_url = appData.uploadedImageUrl;
            }
            
            const result = await apiCall('/generate', {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            
            if (result.error) {
                submitBtn.disabled = false;
                submitBtn.textContent = '✨ Сгенерировать';
                
                if (result.error === 'Insufficient balance') {
                    tg.showAlert(`Недостаточно средств!\n\nНужно: ${result.price} ₽\nБаланс: ${result.balance} ₽`);
                } else {
                    tg.showAlert(`Ошибка: ${result.error}`);
                }
                return;
            }
            
            currentJobId = result.job_id;
            navigate(() => renderGenerating(modelId, result.job_id));
        }
        
        function renderGenerating(modelId, jobId) {
            const app = document.getElementById('app');
            
            app.innerHTML = `
                <div class="status-card">
                    <div class="status-spinner"></div>
                    <div class="status-title">Генерация...</div>
                    <div class="status-text">Это может занять от 10 секунд до нескольких минут</div>
                    <div style="margin-top: 20px; font-size: 12px; color: var(--tg-theme-hint-color);">
                        ID: ${jobId}
                    </div>
                </div>
            `;
            
            // Start polling
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(() => pollJobStatus(jobId), 3000);
            
            // Also poll immediately
            setTimeout(() => pollJobStatus(jobId), 1000);
        }
        
        async function pollJobStatus(jobId) {
            const result = await apiCall(`/jobs/${jobId}`);
            
            if (result.error && result.error !== 'Job not found') {
                // Still processing
                return;
            }
            
            if (result.status === 'completed' || result.status === 'success') {
                if (pollInterval) clearInterval(pollInterval);
                renderResult(result);
            } else if (result.status === 'failed') {
                if (pollInterval) clearInterval(pollInterval);
                renderError(result.error || 'Генерация не удалась');
            }
            // If pending, continue polling
        }
        
        function renderResult(job) {
            const app = document.getElementById('app');
            const isVideo = job.result_url && (job.result_url.includes('.mp4') || job.result_url.includes('video'));
            
            app.innerHTML = `
                <div class="page-header">
                    <button class="back-btn" onclick="goHome()">←</button>
                    <div class="page-title">✨ Результат</div>
                </div>
                
                <div class="result-card">
                    ${isVideo ? `
                        <video class="result-video" src="${job.result_url}" controls autoplay loop></video>
                    ` : `
                        <img class="result-image" src="${job.result_url}" alt="Result" />
                    `}
                </div>
                
                <button class="btn" onclick="window.open('${job.result_url}', '_blank')">
                    📥 Скачать
                </button>
                <button class="btn btn-secondary" onclick="goHome()">
                    🏠 На главную
                </button>
            `;
        }
        
        function renderError(errorMsg) {
            const app = document.getElementById('app');
            
            app.innerHTML = `
                <div class="page-header">
                    <button class="back-btn" onclick="goHome()">←</button>
                    <div class="page-title">Ошибка</div>
                </div>
                
                <div class="error-card">
                    <div class="error-icon">😔</div>
                    <div class="error-title">Генерация не удалась</div>
                    <div class="error-text">${errorMsg}</div>
                </div>
                
                <button class="btn" onclick="goBack()">
                    🔄 Попробовать снова
                </button>
                <button class="btn btn-secondary" onclick="goHome()">
                    🏠 На главную
                </button>
            `;
        }
        
        function showHistory() {
            updateNav(3);
            navigate(renderHistory);
        }
        
        async function renderHistory() {
            const app = document.getElementById('app');
            
            app.innerHTML = `
                <div class="page-header">
                    <div class="page-title">📋 История генераций</div>
                </div>
                <div class="loading">
                    <div class="loading-spinner"></div>
                </div>
            `;
            
            const result = await apiCall(`/user/${appData.user.id}/history`);
            const history = result.history || [];
            
            if (history.length === 0) {
                app.innerHTML = `
                    <div class="page-header">
                        <div class="page-title">📋 История генераций</div>
                    </div>
                    <div class="error-card">
                        <div class="error-icon">📭</div>
                        <div class="error-title">Пока пусто</div>
                        <div class="error-text">Ваши генерации появятся здесь</div>
                    </div>
                    <button class="btn" onclick="showCategories()">
                        🎨 Создать генерацию
                    </button>
                `;
                return;
            }
            
            app.innerHTML = `
                <div class="page-header">
                    <div class="page-title">📋 История генераций</div>
                </div>
                ${history.map(h => `
                    <div class="history-item" onclick="${h.result_url ? `window.open('${h.result_url}', '_blank')` : ''}">
                        ${h.result_url ? `<img class="history-thumb" src="${h.result_url}" />` : '<div class="history-thumb"></div>'}
                        <div class="history-info">
                            <div class="history-model">${h.model_id || 'Неизвестно'}</div>
                            <div class="history-status">${h.status === 'completed' ? '✅ Готово' : h.status === 'failed' ? '❌ Ошибка' : '⏳ В процессе'}</div>
                            <div class="history-date">${h.created_at || ''}</div>
                        </div>
                    </div>
                `).join('')}
            `;
        }
        
        function openBot() {
            tg.openTelegramLink('https://t.me/kie_ai_bot');
        }
        
        // Cleanup on close
        tg.onEvent('viewportChanged', () => {
            if (tg.viewportHeight === 0 && pollInterval) {
                clearInterval(pollInterval);
            }
        });
        
        loadApp();
    </script>
</body>
</html>
