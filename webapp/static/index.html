<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Генератор</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #999999;
            --tg-theme-link-color: #2481cc;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-secondary-bg-color: #f0f0f0;
            --tg-theme-destructive-text-color: #ff3b30;
            --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-color: #34c759;
            --warning-color: #ff9500;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            min-height: 100vh;
            padding-bottom: 100px;
        }
        
        .container { max-width: 100%; padding: 0 16px; }
        
        /* Page Header */
        .page-header {
            display: flex; align-items: center; gap: 12px;
            padding: 16px 0; margin-bottom: 8px;
        }
        .back-btn {
            width: 36px; height: 36px;
            background: var(--tg-theme-secondary-bg-color);
            border: none; border-radius: 50%;
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .page-title { font-size: 20px; font-weight: 600; flex: 1; }
        
        /* Header */
        .header {
            background: var(--accent-gradient);
            padding: 24px 16px 32px;
            margin: 0 -16px 16px;
            border-radius: 0 0 24px 24px;
            color: white;
        }
        .header-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .user-avatar {
            width: 52px; height: 52px; border-radius: 50%;
            background: rgba(255,255,255,0.25);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: 700; color: white;
            border: 2px solid rgba(255,255,255,0.4);
        }
        .user-info { flex: 1; }
        .user-name { font-size: 18px; font-weight: 600; }
        .user-username { font-size: 13px; opacity: 0.85; }
        
        /* Balance Card */
        .balance-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 16px;
            display: flex; align-items: center; gap: 12px;
        }
        .balance-icon { font-size: 28px; }
        .balance-info { flex: 1; }
        .balance-label { font-size: 12px; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.5px; }
        .balance-value { font-size: 28px; font-weight: 700; }
        .balance-value .currency { font-size: 16px; opacity: 0.7; }
        .balance-btn {
            background: rgba(255,255,255,0.25);
            border: none; border-radius: 12px;
            padding: 10px 16px; color: white;
            font-weight: 600; font-size: 14px;
            cursor: pointer;
        }
        
        /* Section */
        .section { margin-bottom: 20px; }
        .section-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px; padding: 0 4px;
        }
        .section-title { font-size: 17px; font-weight: 600; }
        .section-link { font-size: 14px; color: var(--tg-theme-link-color); cursor: pointer; }
        
        /* Category Cards */
        .category-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .category-card {
            background: var(--tg-theme-secondary-bg-color);
            border-radius: 16px;
            padding: 20px 16px;
            cursor: pointer;
            transition: transform 0.15s;
            text-align: center;
        }
        .category-card:active { transform: scale(0.97); }
        .category-icon { font-size: 40px; margin-bottom: 10px; }
        .category-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .category-count { font-size: 12px; color: var(--tg-theme-hint-color); }
        
        /* Model List */
        .model-list { display: flex; flex-direction: column; gap: 8px; }
        .model-item {
            display: flex; align-items: center; gap: 12px;
            background: var(--tg-theme-secondary-bg-color);
            border-radius: 14px;
            padding: 14px;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .model-item:active { transform: scale(0.98); }
        .model-icon { font-size: 32px; }
        .model-info { flex: 1; }
        .model-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
        .model-desc { font-size: 12px; color: var(--tg-theme-hint-color); }
        .model-price { font-size: 14px; font-weight: 600; color: var(--tg-theme-button-color); }
        
        /* Form */
        .form-group { margin-bottom: 16px; }
        .form-label { font-size: 14px; font-weight: 500; margin-bottom: 8px; display: block; }
        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--tg-theme-secondary-bg-color);
            border-radius: 12px;
            font-size: 16px;
            background: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            resize: none;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--tg-theme-button-color);
        }
        .form-textarea { min-height: 120px; }
        
        /* Image Upload */
        .image-upload-area {
            background: var(--tg-theme-secondary-bg-color);
            border: 2px dashed var(--tg-theme-hint-color);
            border-radius: 16px;
            padding: 32px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--tg-theme-hint-color);
        }
        .image-upload-area:active {
            border-color: var(--tg-theme-button-color);
            background: rgba(36, 129, 204, 0.1);
        }
        
        /* Button */
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
        }
        .btn:active { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary {
            background: var(--tg-theme-secondary-bg-color);
            color: var(--tg-theme-text-color);
        }
        
        /* Price Card */
        .price-card {
            background: var(--tg-theme-secondary-bg-color);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .price-label { font-size: 14px; color: var(--tg-theme-hint-color); }
        .price-value { font-size: 24px; font-weight: 700; color: var(--tg-theme-button-color); }
        
        /* Result */
        .result-card {
            background: var(--tg-theme-secondary-bg-color);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .result-image {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
        }
        .result-video {
            width: 100%;
            border-radius: 16px;
        }
        .result-actions {
            padding: 16px;
            display: flex;
            gap: 12px;
        }
        .result-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        
        /* Status */
        .status-card {
            text-align: center;
            padding: 40px 20px;
        }
        .status-spinner {
            width: 60px; height: 60px;
            border: 4px solid var(--tg-theme-secondary-bg-color);
            border-top-color: var(--tg-theme-button-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        .status-icon { font-size: 60px; margin-bottom: 16px; }
        .status-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .status-text { font-size: 14px; color: var(--tg-theme-hint-color); }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--tg-theme-bg-color);
            border-top: 1px solid var(--tg-theme-secondary-bg-color);
            display: flex;
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
        }
        .nav-item {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; gap: 4px;
            padding: 8px; cursor: pointer;
            color: var(--tg-theme-hint-color);
            transition: color 0.2s;
        }
        .nav-item.active { color: var(--tg-theme-button-color); }
        .nav-icon { font-size: 22px; }
        .nav-label { font-size: 11px; font-weight: 500; }
        
        /* Loading */
        .loading {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 60vh; gap: 16px;
        }
        .loading-spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--tg-theme-secondary-bg-color);
            border-top-color: var(--tg-theme-button-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-text { color: var(--tg-theme-hint-color); font-size: 14px; }
        
        /* Error */
        .error-card {
            background: var(--tg-theme-secondary-bg-color);
            border-radius: 16px;
            padding: 24px; text-align: center; margin: 20px 0;
        }
        .error-icon { font-size: 48px; margin-bottom: 12px; }
        .error-title { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
        .error-text { font-size: 14px; color: var(--tg-theme-hint-color); }
        
        /* History Item */
        .history-item {
            display: flex; gap: 12px;
            background: var(--tg-theme-secondary-bg-color);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .history-thumb {
            width: 60px; height: 60px;
            border-radius: 10px;
            background: var(--tg-theme-hint-color);
            object-fit: cover;
        }
        .history-info { flex: 1; }
        .history-model { font-size: 14px; font-weight: 600; }
        .history-status { font-size: 12px; color: var(--tg-theme-hint-color); }
        .history-date { font-size: 11px; color: var(--tg-theme-hint-color); margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="app">
            <div class="loading">
                <div class="loading-spinner"></div>
                <div class="loading-text">Загрузка...</div>
            </div>
        </div>
    </div>
    
    <div class="bottom-nav" id="bottomNav" style="display:none;">
        <div class="nav-item active" onclick="goHome()">
            <div class="nav-icon">🏠</div>
            <div class="nav-label">Главная</div>
        </div>
        <div class="nav-item" onclick="showCategories()">
            <div class="nav-icon">🎨</div>
            <div class="nav-label">Генерация</div>
        </div>
        <div class="nav-item" onclick="showHistory()">
            <div class="nav-icon">📋</div>
            <div class="nav-label">История</div>
        </div>
        <div class="nav-item" onclick="openBot()">
            <div class="nav-icon">🤖</div>
            <div class="nav-label">Бот</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        const API_BASE = '/webapp/api';
        let appData = { user: null, balance: 0, freeRemaining: 0, models: [], freeModels: [], categories: {} };
        let navHistory = [];
        let currentJobId = null;
        let pollInterval = null;
        
        async function apiCall(endpoint, options = {}) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    ...options,
                    headers: { 
                        'X-Telegram-Init-Data': tg.initData || '',
                        'Content-Type': 'application/json',
                        ...options.headers 
                    }
                });
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                return { error: error.message };
            }
        }
        
        function getUser() { return tg.initDataUnsafe?.user || null; }
        function getInitial(name) { return name ? name.charAt(0).toUpperCase() : '?'; }
        
        function groupModelsByType(models) {
            const categories = {
                'text-to-image': { key: 'text-to-image', name: 'Текст → Фото', icon: '🖼️', desc: 'Создайте изображение по описанию', models: [] },
                'image-to-image': { key: 'image-to-image', name: 'Редактор фото', icon: '🧩', desc: 'Измените или улучшите фото', models: [] },
                'text-to-video': { key: 'text-to-video', name: 'Текст → Видео', icon: '🎬', desc: 'Создайте видео по сценарию', models: [] },
                'image-to-video': { key: 'image-to-video', name: 'Фото → Видео', icon: '🎞️', desc: 'Оживите ваше изображение', models: [] },
                'other': { key: 'other', name: 'Другое', icon: '🧰', desc: 'Специальные инструменты', models: [] }
            };
            
            (models || []).forEach(m => {
                const type = m.type || 'other';
                if (categories[type]) categories[type].models.push(m);
                else categories['other'].models.push(m);
            });
            
            return categories;
        }
        
        function updateNav(active) {
            document.querySelectorAll('.nav-item').forEach((el, i) => {
                el.classList.toggle('active', i === active);
            });
        }
        
        function navigate(renderFn) {
            navHistory.push(renderFn);
            renderFn();
        }
        
        function goBack() {
            if (navHistory.length > 1) {
                navHistory.pop();
                navHistory[navHistory.length - 1]();
            } else {
                goHome();
            }
        }
        
        async function loadApp() {
            const app = document.getElementById('app');
            const user = getUser();
            
            if (!user) {
                app.innerHTML = `
                    <div class="error-card" style="margin-top: 40px;">
                        <div class="error-icon">⚠️</div>
                        <div class="error-title">Откройте через Telegram</div>
                        <div class="error-text">Это приложение работает только внутри Telegram</div>
                    </div>
                `;
                return;
            }
            
            appData.user = user;
            
            try {
                const [balanceData, modelsData] = await Promise.all([
                    apiCall(`/user/${user.id}/balance`),
                    apiCall('/models')
                ]);
                
                appData.balance = balanceData.balance || 0;
                appData.freeRemaining = balanceData.free_remaining || 0;
                appData.models = modelsData.models || [];
                appData.freeModels = appData.models.filter(m => m.is_free);
                appData.categories = groupModelsByType(appData.models);
                
                document.getElementById('bottomNav').style.display = 'flex';
                goHome();
                
            } catch (e) {
                console.error('Load error:', e);
                app.innerHTML = `
                    <div class="error-card" style="margin-top: 40px;">
                        <div class="error-icon">❌</div>
                        <div class="error-title">Ошибка загрузки</div>
                        <div class="error-text">${e.message}</div>
                    </div>
                `;
            }
        }
        
        function goHome() {
            navHistory = [];
            updateNav(0);
            renderHome();
        }
        
        function renderHome() {
            const app = document.getElementById('app');
            const user = appData.user;
            const cats = Object.values(appData.categories).filter(c => c.models.length > 0);
            
            app.innerHTML = `
                <div class="header">
                    <div class="header-top">
                        <div class="user-avatar">${getInitial(user.first_name)}</div>
                        <div class="user-info">
                            <div class="user-name">${user.first_name} ${user.last_name || ''}</div>
                            <div class="user-username">@${user.username || 'user'}</div>
                        </div>
                    </div>
                    <div class="balance-card">
                        <div class="balance-icon">💰</div>
                        <div class="balance-info">
                            <div class="balance-label">Баланс</div>
                            <div class="balance-value">${appData.balance.toFixed(2)} <span class="currency">₽</span></div>
                        </div>
                        <button class="balance-btn" onclick="openBot()">Пополнить</button>
                    </div>
                    ${appData.freeRemaining > 0 ? `
                        <div class="free-badge" style="margin-top: 12px; background: rgba(52, 199, 89, 0.2); padding: 10px 16px; border-radius: 12px; display: flex; align-items: center; gap: 8px;">
                            <span style="font-size: 20px;">⚡</span>
                            <span style="font-size: 14px;"><b>${appData.freeRemaining}</b> бесплатных генераций</span>
                        </div>
                    ` : ''}
                </div>
                
                ${appData.freeModels.length > 0 ? `
                    <div class="section">
                        <div class="section-header">
                            <div class="section-title">⚡ Бесплатные модели</div>
                        </div>
                        <div class="model-list">
                            ${appData.freeModels.slice(0, 3).map(m => `
                                <div class="model-item" onclick="showModelForm('${m.id}')" style="border: 2px solid var(--success-color);">
                                    <div class="model-icon">${m.emoji || '🎨'}</div>
                                    <div class="model-info">
                                        <div class="model-name">${m.name || m.id}</div>
                                        <div class="model-desc" style="color: var(--success-color);">Бесплатно</div>
                                    </div>
                                    <div class="model-price" style="color: var(--success-color);">FREE</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}
                
                <div class="section">
                    <div class="section-header">
                        <div class="section-title">Выберите тип генерации</div>
                    </div>
                    <div class="category-grid">
                        ${cats.slice(0, 4).map(cat => `
                            <div class="category-card" onclick="showCategoryModels('${cat.key}')">
                                <div class="category-icon">${cat.icon}</div>
                                <div class="category-name">${cat.name}</div>
                                <div class="category-count">${cat.models.length} моделей</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                
                ${cats.length > 4 ? `
                    <div class="section">
                        <div class="category-grid">
                            ${cats.slice(4).map(cat => `
                                <div class="category-card" onclick="showCategoryModels('${cat.key}')">
                                    <div class="category-icon">${cat.icon}</div>
                                    <div class="category-name">${cat.name}</div>
                                    <div class="category-count">${cat.models.length} моделей</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}
            `;
        }
        
        function showCategories() {
            updateNav(1);
            navigate(renderCategories);
        }
        
        function renderCategories() {
            const app = document.getElementById('app');
            const cats = Object.values(appData.categories).filter(c => c.models.length > 0);
            
            app.innerHTML = `
                <div class="page-header">
                    <div class="page-title">🎨 Выберите категорию</div>
                </div>
                <div class="category-grid">
                    ${cats.map(cat => `
                        <div class="category-card" onclick="showCategoryModels('${cat.key}')">
                            <div class="category-icon">${cat.icon}</div>
                            <div class="category-name">${cat.name}</div>
                            <div class="category-count">${cat.models.length} моделей</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        function showCategoryModels(categoryKey) {
            updateNav(1);
            navigate(() => renderCategoryModels(categoryKey));
        }
        
        function renderCategoryModels(categoryKey) {
            const app = document.getElementById('app');
            const cat = appData.categories[categoryKey];
            
            if (!cat) { goHome(); return; }
            
            app.innerHTML = `
                <div class="page-header">
                    <button class="back-btn" onclick="goBack()">←</button>
                    <div class="page-title">${cat.icon} ${cat.name}</div>
                </div>
                <div class="model-list">
                    ${cat.models.map(m => `
                        <div class="model-item" onclick="showModelForm('${m.id}')" ${m.is_free ? 'style="border: 2px solid var(--success-color);"' : ''}>
                            <div class="model-icon">${m.emoji || '🎨'}</div>
                            <div class="model-info">
                                <div class="model-name">${m.name || m.id}</div>
                                <div class="model-desc">${m.is_free ? '⚡ Бесплатно' : `от ${(m.price || 0).toFixed(2)} ₽`}</div>
                            </div>
                            <div class="model-price" ${m.is_free ? 'style="color: var(--success-color);"' : ''}>${m.is_free ? 'FREE' : '›'}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        async function showModelForm(modelId) {
            updateNav(1);
            navigate(() => renderModelForm(modelId));
        }
        
        async function renderModelForm(modelId) {
            const app = document.getElementById('app');
            
            app.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Загрузка модели...</div>
                </div>
            `;
            
            const modelInfo = await apiCall(`/models/${modelId}`);
            
            if (modelInfo.error) {
                app.innerHTML = `
                    <div class="page-header">
                        <button class="back-btn" onclick="goBack()">←</button>
                        <div class="page-title">Ошибка</div>
                    </div>
                    <div class="error-card">
                        <div class="error-icon">❌</div>
                        <div class="error-title">Модель не найдена</div>
                        <div class="error-text">${modelInfo.error}</div>
                    </div>
                `;
                return;
            }
            
            const requiresImage = modelInfo.requires_image;
            appData.currentModel = modelInfo;
            appData.uploadedImageUrl = null;
            
            app.innerHTML = `
                <div class="page-header">
                    <button class="back-btn" onclick="goBack()">←</button>
                    <div class="page-title">${modelInfo.emoji || '🎨'} ${modelInfo.name || modelId}</div>
                </div>
                
                <div class="price-card">
                    <div>
                        <div class="price-label">Стоимость генерации</div>
                        <div style="font-size: 12px; color: var(--tg-theme-hint-color);">Баланс: ${appData.balance.toFixed(2)} ₽</div>
                    </div>
                    <div class="price-value">${(modelInfo.price || 0).toFixed(2)} ₽</div>
                </div>
                
                <form id="genForm" onsubmit="submitGeneration(event, '${modelId}', ${requiresImage})">
                    ${requiresImage ? `
                        <div class="form-group">
                            <label class="form-label">📷 Загрузите изображение</label>
                            <div id="imageUploadArea" class="image-upload-area" onclick="document.getElementById('imageInput').click()">
                                <div id="uploadPlaceholder">
                                    <div style="font-size: 48px; margin-bottom: 12px;">📷</div>
                                    <div>Нажмите чтобы выбрать фото</div>
                                    <div style="font-size: 12px; margin-top: 8px; opacity: 0.7;">JPG, PNG до 10MB</div>
                                </div>
                                <img id="imagePreview" style="display: none; width: 100%; border-radius: 12px;" />
                            </div>
                            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelect(this)" />
                        </div>
                    ` : ''}
                    
                    <div class="form-group">
                        <label class="form-label">✍️ ${requiresImage ? 'Опишите что хотите сделать с изображением' : 'Опишите что хотите создать'}</label>
                        <textarea 
                            class="form-input form-textarea" 
                            id="promptInput"
                            placeholder="${requiresImage ? 'Например: Сделай изображение в стиле аниме, добавь эффект заката...' : 'Например: Красивый закат над морем, яркие краски, реалистичный стиль...'}"
                            required
                        ></textarea>
                    </div>
                    
                    <button type="submit" class="btn" id="submitBtn">
                        ✨ Сгенерировать за ${(modelInfo.price || 0).toFixed(2)} ₽
                    </button>
                </form>
            `;
        }
        
        async function handleImageSelect(input) {
            const file = input.files[0];
            if (!file) return;
            
            if (file.size > 10 * 1024 * 1024) {
                tg.showAlert('Файл слишком большой. Максимум 10MB.');
                return;
            }
            
            const preview = document.getElementById('imagePreview');
            const placeholder = document.getElementById('uploadPlaceholder');
            const uploadArea = document.getElementById('imageUploadArea');
            
            // Show loading
            placeholder.innerHTML = '<div class="loading-spinner" style="width: 30px; height: 30px;"></div><div style="margin-top: 12px;">Загрузка...</div>';
            
            try {
                // Read file as base64
                const base64 = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
                
                // Upload to server
                const result = await apiCall('/upload', {
                    method: 'POST',
                    body: JSON.stringify({ image: base64 })
                });
                
                if (result.error) {
                    throw new Error(result.error);
                }
                
                // Store URL and show preview
                appData.uploadedImageUrl = result.url;
                preview.src = base64;
                preview.style.display = 'block';
                placeholder.style.display = 'none';
                uploadArea.style.padding = '0';
                uploadArea.style.background = 'transparent';
                
            } catch (e) {
                tg.showAlert('Ошибка загрузки: ' + e.message);
                placeholder.innerHTML = `
                    <div style="font-size: 48px; margin-bottom: 12px;">📷</div>
                    <div>Нажмите чтобы выбрать фото</div>
                `;
            }
        }
        
        async function submitGeneration(event, modelId, requiresImage = false) {
            event.preventDefault();
            
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) {
                tg.showAlert('Введите описание для генерации');
                return;
            }
            
            // Check if image is required but not uploaded
            if (requiresImage && !appData.uploadedImageUrl) {
                tg.showAlert('Загрузите изображение для этой модели');
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Отправка...';
            
            const payload = {
                model_id: modelId,
                prompt: prompt,
                params: {}
            };
            
            // Add image URL if uploaded
            if (appData.uploadedImageUrl) {
                payload.image_url = appData.uploadedImageUrl;
            }
            
            const result = await apiCall('/generate', {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            
            if (result.error) {
                submitBtn.disabled = false;
                submitBtn.textContent = '✨ Сгенерировать';
                
                if (result.error === 'Insufficient balance') {
                    tg.showAlert(`Недостаточно средств!\n\nНужно: ${result.price} ₽\nБаланс: ${result.balance} ₽`);
                } else {
                    tg.showAlert(`Ошибка: ${result.error}`);
                }
                return;
            }
            
            currentJobId = result.job_id;
            navigate(() => renderGenerating(modelId, result.job_id));
        }
        
        function renderGenerating(modelId, jobId) {
            const app = document.getElementById('app');
            
            app.innerHTML = `
                <div class="status-card">
                    <div class="status-spinner"></div>
                    <div class="status-title">Генерация...</div>
                    <div class="status-text">Это может занять от 10 секунд до нескольких минут</div>
                    <div style="margin-top: 20px; font-size: 12px; color: var(--tg-theme-hint-color);">
                        ID: ${jobId}
                    </div>
                </div>
            `;
            
            // Start polling
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(() => pollJobStatus(jobId), 3000);
            
            // Also poll immediately
            setTimeout(() => pollJobStatus(jobId), 1000);
        }
        
        async function pollJobStatus(jobId) {
            const result = await apiCall(`/jobs/${jobId}`);
            
            if (result.error && result.error !== 'Job not found') {
                // Still processing
                return;
            }
            
            if (result.status === 'completed' || result.status === 'success') {
                if (pollInterval) clearInterval(pollInterval);
                renderResult(result);
            } else if (result.status === 'failed') {
                if (pollInterval) clearInterval(pollInterval);
                renderError(result.error || 'Генерация не удалась');
            }
            // If pending, continue polling
        }
        
        function renderResult(job) {
            const app = document.getElementById('app');
            const isVideo = job.result_url && (job.result_url.includes('.mp4') || job.result_url.includes('video'));
            
            app.innerHTML = `
                <div class="page-header">
                    <button class="back-btn" onclick="goHome()">←</button>
                    <div class="page-title">✨ Результат</div>
                </div>
                
                <div class="result-card">
                    ${isVideo ? `
                        <video class="result-video" src="${job.result_url}" controls autoplay loop></video>
                    ` : `
                        <img class="result-image" src="${job.result_url}" alt="Result" />
                    `}
                </div>
                
                <button class="btn" onclick="window.open('${job.result_url}', '_blank')">
                    📥 Скачать
                </button>
                <button class="btn btn-secondary" onclick="goHome()">
                    🏠 На главную
                </button>
            `;
        }
        
        function renderError(errorMsg) {
            const app = document.getElementById('app');
            
            app.innerHTML = `
                <div class="page-header">
                    <button class="back-btn" onclick="goHome()">←</button>
                    <div class="page-title">Ошибка</div>
                </div>
                
                <div class="error-card">
                    <div class="error-icon">😔</div>
                    <div class="error-title">Генерация не удалась</div>
                    <div class="error-text">${errorMsg}</div>
                </div>
                
                <button class="btn" onclick="goBack()">
                    🔄 Попробовать снова
                </button>
                <button class="btn btn-secondary" onclick="goHome()">
                    🏠 На главную
                </button>
            `;
        }
        
        function showHistory() {
            updateNav(2);
            navigate(renderHistory);
        }
        
        async function renderHistory() {
            const app = document.getElementById('app');
            
            app.innerHTML = `
                <div class="page-header">
                    <div class="page-title">📋 История генераций</div>
                </div>
                <div class="loading">
                    <div class="loading-spinner"></div>
                </div>
            `;
            
            const result = await apiCall(`/user/${appData.user.id}/history`);
            const history = result.history || [];
            
            if (history.length === 0) {
                app.innerHTML = `
                    <div class="page-header">
                        <div class="page-title">📋 История генераций</div>
                    </div>
                    <div class="error-card">
                        <div class="error-icon">📭</div>
                        <div class="error-title">Пока пусто</div>
                        <div class="error-text">Ваши генерации появятся здесь</div>
                    </div>
                    <button class="btn" onclick="showCategories()">
                        🎨 Создать генерацию
                    </button>
                `;
                return;
            }
            
            app.innerHTML = `
                <div class="page-header">
                    <div class="page-title">📋 История генераций</div>
                </div>
                ${history.map(h => `
                    <div class="history-item" onclick="${h.result_url ? `window.open('${h.result_url}', '_blank')` : ''}">
                        ${h.result_url ? `<img class="history-thumb" src="${h.result_url}" />` : '<div class="history-thumb"></div>'}
                        <div class="history-info">
                            <div class="history-model">${h.model_id || 'Неизвестно'}</div>
                            <div class="history-status">${h.status === 'completed' ? '✅ Готово' : h.status === 'failed' ? '❌ Ошибка' : '⏳ В процессе'}</div>
                            <div class="history-date">${h.created_at || ''}</div>
                        </div>
                    </div>
                `).join('')}
            `;
        }
        
        function openBot() {
            tg.close();
        }
        
        // Cleanup on close
        tg.onEvent('viewportChanged', () => {
            if (tg.viewportHeight === 0 && pollInterval) {
                clearInterval(pollInterval);
            }
        });
        
        loadApp();
    </script>
</body>
</html>
