        function generateFieldHTML(field) {
            const required = field.required ? 'required' : '';
            const hint = field.hint ? `<div class="field-hint">${field.hint}</div>` : '';
            
            // File upload fields
            if (field.type === 'file_urls' || field.name.includes('image_input') || field.name.includes('image_urls')) {
                return `
                    <div class="form-group" data-field="${field.name}">
                        <label class="form-label">🖼️ ${field.label} ${field.required ? '<span style="color: var(--error);">*</span>' : ''}</label>
                        ${hint}
                        <div id="imageUploadArea_${field.name}" class="image-upload-area" onclick="document.getElementById('imageInput_${field.name}').click()">
                            <div id="uploadPlaceholder_${field.name}">
                                <div style="font-size: 48px; margin-bottom: 12px;">📷</div>
                                <div>Нажмите чтобы выбрать фото</div>
                                <div style="font-size: 12px; margin-top: 8px; opacity: 0.7;">JPG, PNG до 10MB</div>
                            </div>
                            <img id="imagePreview_${field.name}" style="display: none; width: 100%; border-radius: 12px;" />
                        </div>
                        <input type="file" id="imageInput_${field.name}" data-field="${field.name}" accept="image/*" style="display: none;" onchange="handleImageSelectField(this, '${field.name}')" />
                        <div id="fieldError_${field.name}" class="field-error" style="display: none;"></div>
                    </div>
                `;
            }
            
            // Audio upload (for lip_sync and speech models)
            if (field.name.includes('audio')) {
                return `
                    <div class="form-group" data-field="${field.name}">
                        <label class="form-label">🎵 ${field.label} ${field.required ? '<span style="color: var(--error);">*</span>' : ''}</label>
                        ${hint}
                        <div id="audioUploadArea_${field.name}" class="image-upload-area" onclick="document.getElementById('audioInput_${field.name}').click()">
                            <div id="audioPlaceholder_${field.name}">
                                <div style="font-size: 48px; margin-bottom: 12px;">🎤</div>
                                <div>Нажмите чтобы выбрать аудио</div>
                                <div style="font-size: 12px; margin-top: 8px; opacity: 0.7;">MP3, WAV до 25MB</div>
                            </div>
                            <audio id="audioPreview_${field.name}" style="display: none; width: 100%;" controls></audio>
                        </div>
                        <input type="file" id="audioInput_${field.name}" data-field="${field.name}" accept="audio/*" style="display: none;" onchange="handleAudioSelectField(this, '${field.name}')" />
                        <div id="fieldError_${field.name}" class="field-error" style="display: none;"></div>
                    </div>
                `;
            }
            
            // Video upload (includes video_urls for motion control reference)
            if (field.name.includes('video_input') || field.name.includes('video_url') || field.name === 'video_urls') {
                return `
                    <div class="form-group" data-field="${field.name}">
                        <label class="form-label">📹 ${field.label} ${field.required ? '<span style="color: var(--error);">*</span>' : ''}</label>
                        ${hint}
                        <div id="videoUploadArea_${field.name}" class="image-upload-area" onclick="document.getElementById('videoInput_${field.name}').click()">
                            <div id="videoPlaceholder_${field.name}">
                                <div style="font-size: 48px; margin-bottom: 12px;">🎬</div>
                                <div>Нажмите чтобы выбрать видео-референс</div>
                                <div style="font-size: 12px; margin-top: 8px; opacity: 0.7;">MP4 до 50MB</div>
                            </div>
                            <video id="videoPreview_${field.name}" style="display: none; width: 100%; border-radius: 12px;" controls></video>
                        </div>
                        <input type="file" id="videoInput_${field.name}" data-field="${field.name}" accept="video/*" style="display: none;" onchange="handleVideoSelectField(this, '${field.name}')" />
                        <div id="fieldError_${field.name}" class="field-error" style="display: none;"></div>
                    </div>
                `;
            }
            
            // Enum / select
            if (field.type === 'enum' && field.options) {
                const options = field.options.map(opt => 
                    `<option value="${opt}" ${opt === field.default ? 'selected' : ''}>${opt}</option>`
                ).join('');
                return `
                    <div class="form-group" data-field="${field.name}">
                        <label class="form-label">⚙️ ${field.label} ${field.required ? '<span style="color: var(--error);">*</span>' : ''}</label>
                        ${hint}
                        <select id="field_${field.name}" data-field="${field.name}" class="form-input form-select" ${required}>
                            ${options}
                        </select>
                        <div id="fieldError_${field.name}" class="field-error" style="display: none;"></div>
                    </div>
                `;
            }
            
            // Boolean
            if (field.type === 'boolean') {
                const checked = field.default ? 'checked' : '';
                return `
                    <div class="form-group form-checkbox-group" data-field="${field.name}">
                        <label class="form-checkbox-label">
                            <input type="checkbox" id="field_${field.name}" data-field="${field.name}" ${checked} />
                            <span>${field.label}</span>
                        </label>
                        ${hint}
                    </div>
                `;
            }
            
            // Number
            if (field.type === 'number' || field.type === 'integer') {
                const min = field.min !== undefined ? `min="${field.min}"` : '';
                const max = field.max !== undefined ? `max="${field.max}"` : '';
                const defaultVal = field.default !== undefined ? `value="${field.default}"` : '';
                return `
                    <div class="form-group" data-field="${field.name}">
                        <label class="form-label">🔢 ${field.label} ${field.required ? '<span style="color: var(--error);">*</span>' : ''}</label>
                        ${hint}
                        <input type="number" id="field_${field.name}" data-field="${field.name}" class="form-input" ${min} ${max} ${defaultVal} ${required} />
                        <div id="fieldError_${field.name}" class="field-error" style="display: none;"></div>
                    </div>
                `;
            }
            
            // String / text (prompt)
            const isPrompt = field.name === 'prompt' || field.name === 'text';
            const maxLength = field.maxLength ? `maxlength="${field.maxLength}"` : '';
            
            // Context-aware placeholder for i2i/i2v models
            let defaultPlaceholder = 'Опишите что хотите создать...';
            if (isPrompt && appData.currentModel) {
                const model = appData.currentModel;
                const hasImageInput = model.requires_image || 
                    (model.ux_schema?.fields || []).some(f => 
                        f.type === 'file_urls' || f.name.includes('image')
                    );
                if (hasImageInput) {
                    defaultPlaceholder = 'Опишите что сделать с фото...';
                }
            }
            const placeholder = field.placeholder || field.example || (isPrompt ? defaultPlaceholder : '');
            
            if (isPrompt) {
                return `
                    <div class="form-group" data-field="${field.name}">
                        <label class="form-label">✍️ ${field.label} ${field.required ? '<span style="color: var(--error);">*</span>' : ''}</label>
                        ${hint}
                        <textarea 
                            id="field_${field.name}" 
                            data-field="${field.name}"
                            class="form-input form-textarea" 
                            placeholder="${placeholder}"
                            ${maxLength}
                            ${required}
                        ></textarea>
                        <div id="fieldError_${field.name}" class="field-error" style="display: none;"></div>
                    </div>
                `;
            }
            
            // Default: text input
            return `
                <div class="form-group" data-field="${field.name}">
                    <label class="form-label">${field.label} ${field.required ? '<span style="color: var(--error);">*</span>' : ''}</label>
                    ${hint}
                    <input type="text" id="field_${field.name}" data-field="${field.name}" class="form-input" placeholder="${placeholder}" ${maxLength} ${required} />
                    <div id="fieldError_${field.name}" class="field-error" style="display: none;"></div>
                </div>
            `;
        }
        
        function validateField(field, value) {
            // Required check
            if (field.required && (value === null || value === undefined || value === '')) {
                return { valid: false, error: field.error || `${field.label} обязательно` };
            }
            
            // Skip validation for empty optional fields
            if (!field.required && (value === null || value === undefined || value === '')) {
                return { valid: true };
            }
            
            // String length
            if (field.type === 'string' && field.maxLength && value.length > field.maxLength) {
                return { valid: false, error: `Максимум ${field.maxLength} символов` };
            }
            
            // Number range
            if ((field.type === 'number' || field.type === 'integer') && value !== '') {
                const num = parseFloat(value);
                if (isNaN(num)) return { valid: false, error: 'Введите число' };
                if (field.min !== undefined && num < field.min) return { valid: false, error: `Минимум: ${field.min}` };
                if (field.max !== undefined && num > field.max) return { valid: false, error: `Максимум: ${field.max}` };
            }
            
            // Enum validation
            if (field.type === 'enum' && field.options && value) {
                if (!field.options.includes(value)) return { valid: false, error: 'Недопустимое значение' };
            }
            
            return { valid: true };
        }
        
        function validateForm(schema) {
            let isValid = true;
            const errors = [];
            
            for (const field of schema.fields) {
                const el = document.getElementById(`field_${field.name}`);
                const errorEl = document.getElementById(`fieldError_${field.name}`);
                
                let value = null;
                if (el) {
                    if (field.type === 'boolean') {
                        value = el.checked;
                    } else {
                        value = el.value;
                    }
                }
                
                // Check uploaded images/videos/audio (file_urls type or name contains file-related keywords)
                const isFileField = field.type === 'file_urls' || 
                    field.name.includes('image_input') || field.name.includes('image_urls') || 
                    field.name.includes('video_urls') || field.name.includes('video_input') ||
                    field.name.includes('audio') || field.name.includes('input_urls') ||
                    field.name.includes('fileUrls') || field.name.includes('source_image') ||
                    field.name.includes('reference_image');
                    
                if (isFileField && field.required) {
                    if (!appData.uploadedFields || !appData.uploadedFields[field.name]) {
                        isValid = false;
                        let errorText = 'Загрузите файл';
                        if (field.name.includes('video')) errorText = 'Загрузите видео';
                        else if (field.name.includes('audio')) errorText = 'Загрузите аудио';
                        else errorText = 'Загрузите изображение';
                        errors.push({ field: field.name, error: errorText });
                        if (errorEl) {
                            errorEl.textContent = errorText;
                            errorEl.style.display = 'block';
                        }
                        continue;
                    } else {
                        // File uploaded, clear error
                        if (errorEl) errorEl.style.display = 'none';
                        continue;
                    }
                }
                
                const result = validateField(field, value);
                if (!result.valid) {
                    isValid = false;
                    errors.push({ field: field.name, error: result.error });
                    if (errorEl) {
                        errorEl.textContent = result.error;
                        errorEl.style.display = 'block';
                    }
                } else if (errorEl) {
                    errorEl.style.display = 'none';
                }
            }
            
            return { valid: isValid, errors };
        }
        
        async function handleImageSelectField(input, fieldName) {
            const file = input.files[0];
            if (!file) return;
            
            if (file.size > 10 * 1024 * 1024) {
                tg.showAlert('Файл слишком большой. Максимум 10MB.');
                return;
            }
            
            const preview = document.getElementById(`imagePreview_${fieldName}`);
            const placeholder = document.getElementById(`uploadPlaceholder_${fieldName}`);
            const uploadArea = document.getElementById(`imageUploadArea_${fieldName}`);
            
            placeholder.innerHTML = '<div class="loading-spinner" style="width: 30px; height: 30px;"></div><div style="margin-top: 12px;">Загрузка...</div>';
            
            try {
                const base64 = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
                
                const result = await apiCall('/upload', {
                    method: 'POST',
                    body: JSON.stringify({ image: base64 })
                });
                
                if (result.error) throw new Error(result.error);
                
                // Store URL
                if (!appData.uploadedFields) appData.uploadedFields = {};
                appData.uploadedFields[fieldName] = result.url;
                
                preview.src = base64;
                preview.style.display = 'block';
                placeholder.style.display = 'none';
                uploadArea.style.padding = '0';
                uploadArea.style.background = 'transparent';
                
                // Clear error
                const errorEl = document.getElementById(`fieldError_${fieldName}`);
                if (errorEl) errorEl.style.display = 'none';
                
            } catch (e) {
                tg.showAlert('Ошибка загрузки: ' + e.message);
                placeholder.innerHTML = '<div style="font-size: 48px; margin-bottom: 12px;">📷</div><div>Нажмите чтобы выбрать фото</div>';
            }
        }

        async function renderModelForm(modelId) {
            const app = document.getElementById('app');
            
            app.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Загрузка модели...</div>
                </div>
            `;
            
            const modelInfo = await apiCall(`/models/${encodeURIComponent(modelId)}`);
            
            if (modelInfo.error) {
                app.innerHTML = `
                    <div class="page-header">
                        <button class="back-btn" onclick="goBack()">←</button>
                        <div class="page-title">Ошибка</div>
                    </div>
                    <div class="error-card">
                        <div class="error-icon">❌</div>
                        <div class="error-title">Модель не найдена</div>
                        <div class="error-text">${modelInfo.error}</div>
                    </div>
                `;
                return;
            }
            
            appData.currentModel = modelInfo;
            appData.currentSchema = modelInfo.ux_schema || null;
            appData.uploadedFields = {};
            appData.uploadedImageUrl = null;
            
            // Generate form fields from schema
            let fieldsHTML = '';
            if (modelInfo.ux_schema && modelInfo.ux_schema.fields) {
                // Sort: for i2i/i2v models - image fields FIRST, then prompt
                // For t2i/t2v models - prompt first
                const modelType = (modelInfo.type || '').toLowerCase();
                const isImageInput = modelInfo.requires_image || 
                    modelType.includes('i2i') || modelType.includes('i2v') ||
                    modelType.includes('image-to') ||
                    modelInfo.ux_schema.fields.some(f => 
                        f.type === 'file_urls' || 
                        f.name.includes('image_input') || 
                        f.name.includes('image_urls') ||
                        f.name.includes('source_image')
                    );
                
                const sortedFields = [...modelInfo.ux_schema.fields].sort((a, b) => {
                    const aIsImage = a.type === 'file_urls' || a.name.includes('image');
                    const bIsImage = b.type === 'file_urls' || b.name.includes('image');
                    const aIsPrompt = a.name === 'prompt' || a.name === 'text';
                    const bIsPrompt = b.name === 'prompt' || b.name === 'text';
                    
                    // For image-input models: image first, then prompt
                    if (isImageInput) {
                        if (aIsImage && !bIsImage) return -1;
                        if (!aIsImage && bIsImage) return 1;
                    }
                    
                    // Then prompt/text
                    if (aIsPrompt && !bIsPrompt) return isImageInput ? 1 : -1;
                    if (!aIsPrompt && bIsPrompt) return isImageInput ? -1 : 1;
                    
                    // Required before optional
                    if (a.required && !b.required) return -1;
                    if (!a.required && b.required) return 1;
                    return 0;
                });
                
                // Show only non-advanced fields by default
                const basicFields = sortedFields.filter(f => !f.advanced);
                const advancedFields = sortedFields.filter(f => f.advanced);
                
                fieldsHTML = basicFields.map(f => generateFieldHTML(f)).join('');
                
                if (advancedFields.length > 0) {
                    fieldsHTML += `
                        <div class="advanced-toggle" onclick="toggleAdvanced()">
                            <span id="advancedToggleText">▼ Дополнительные параметры (${advancedFields.length})</span>
                        </div>
                        <div id="advancedFields" style="display: none;">
                            ${advancedFields.map(f => generateFieldHTML(f)).join('')}
                        </div>
                    `;
                }
            } else {
                // Fallback: simple form
                const requiresImage = modelInfo.requires_image;
                const promptPlaceholder = requiresImage ? 'Опишите что сделать с фото...' : 'Опишите что хотите создать...';
                const promptLabel = requiresImage ? '✍️ Что сделать с фото' : '✍️ Описание';
                
                // For image-input models: image FIRST, then prompt
                fieldsHTML = requiresImage ? `
                    <div class="form-group">
                        <label class="form-label">📷 Сначала загрузите фото</label>
                        <div id="imageUploadArea_image_input" class="image-upload-area" onclick="document.getElementById('imageInput_image_input').click()">
                            <div id="uploadPlaceholder_image_input">
                                <div style="font-size: 48px; margin-bottom: 12px;">📷</div>
                                <div>Нажмите чтобы выбрать фото</div>
                            </div>
                            <img id="imagePreview_image_input" style="display: none; width: 100%; border-radius: 12px;" />
                        </div>
                        <input type="file" id="imageInput_image_input" accept="image/*" style="display: none;" onchange="handleImageSelectField(this, 'image_input')" />
                    </div>
                ` : '';
                fieldsHTML += `
                    <div class="form-group">
                        <label class="form-label">${promptLabel}</label>
                        <textarea class="form-input form-textarea" id="field_prompt" placeholder="${promptPlaceholder}" required></textarea>
                    </div>
                `;
            }
            
            // Output info from schema
            const outputInfo = modelInfo.ux_schema?.output ? 
                `<div style="font-size: 12px; margin-top: 4px; color: var(--success);">📦 Результат: ${modelInfo.ux_schema.output}</div>` : '';
            
            app.innerHTML = `
                <div class="page-header">
                    <button class="back-btn" onclick="goBack()">←</button>
                    <div class="page-title">${modelInfo.emoji || '🎨'} ${modelInfo.name || modelId}</div>
                </div>
                
                <div class="price-card">
                    <div>
                        <div class="price-label">Стоимость генерации</div>
                        <div style="font-size: 12px; color: var(--tg-theme-hint-color);">Баланс: ${appData.balance.toFixed(2)} ₽</div>
                        ${outputInfo}
                    </div>
                    <div class="price-value">${(modelInfo.price || 0).toFixed(2)} ₽</div>
                </div>
                
                <form id="genForm" onsubmit="submitGenerationWithSchema(event, '${modelId}')">
                    ${fieldsHTML}
                    <button type="submit" class="btn" id="submitBtn">
                        ✨ Сгенерировать за ${(modelInfo.price || 0).toFixed(2)} ₽
                    </button>
                </form>
            `;
        }
        
        function toggleAdvanced() {
            const advFields = document.getElementById('advancedFields');
            const toggleText = document.getElementById('advancedToggleText');
            if (advFields.style.display === 'none') {
                advFields.style.display = 'block';
                toggleText.textContent = toggleText.textContent.replace('▼', '▲');
            } else {
                advFields.style.display = 'none';
                toggleText.textContent = toggleText.textContent.replace('▲', '▼');
            }
        }
        
        async function submitGenerationWithSchema(event, modelId) {
            event.preventDefault();
            
            const schema = appData.currentSchema;
            
            // Validate if schema exists
            if (schema) {
                const validation = validateForm(schema);
                if (!validation.valid) {
                    tg.showAlert('Заполните все обязательные поля');
                    return;
                }
            }
            
            // Collect form data
            const params = {};
            let prompt = '';
            let imageUrl = null;
            
            if (schema && schema.fields) {
                for (const field of schema.fields) {
                    const el = document.getElementById(`field_${field.name}`);
                    
                    // Handle uploaded files (images, videos, audio)
                    const isFileField = field.type === 'file_urls' || 
                        field.name.includes('image_input') || field.name.includes('image_urls') || 
                        field.name.includes('video_urls') || field.name.includes('video_input') ||
                        field.name.includes('audio') || field.name.includes('input_urls') ||
                        field.name.includes('fileUrls') || field.name.includes('source_image') ||
                        field.name.includes('reference_image');
                    if (isFileField) {
                        if (appData.uploadedFields && appData.uploadedFields[field.name]) {
                            params[field.name] = [appData.uploadedFields[field.name]];
                            // Set imageUrl for preview (only for images)
                            if (!field.name.includes('video') && !field.name.includes('audio')) {
                                imageUrl = appData.uploadedFields[field.name];
                            }
                        }
                        continue;
                    }
                    
                    if (!el) continue;
                    
                    let value;
                    if (field.type === 'boolean') {
                        value = el.checked;
                    } else if (field.type === 'number' || field.type === 'integer') {
                        value = el.value ? parseFloat(el.value) : null;
                    } else {
                        value = el.value;
                    }
                    
                    // Store prompt separately
                    if (field.name === 'prompt' || field.name === 'text') {
                        prompt = value || '';
                    }
                    
                    // Only add non-empty values
                    if (value !== null && value !== undefined && value !== '') {
                        params[field.name] = value;
                    }
                }
            } else {
                // Fallback
                const promptEl = document.getElementById('field_prompt');
                prompt = promptEl ? promptEl.value.trim() : '';
                if (appData.uploadedFields && appData.uploadedFields['image_input']) {
                    imageUrl = appData.uploadedFields['image_input'];
                }
            }
            
            if (!prompt) {
                tg.showAlert('Введите описание для генерации');
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Отправка...';
            
            const payload = {
                model_id: modelId,
                prompt: prompt,
                params: params
            };
            
            if (imageUrl) {
                payload.image_url = imageUrl;
            }
            
            const result = await apiCall('/generate', {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            
            if (result.error) {
                submitBtn.disabled = false;
                submitBtn.textContent = '✨ Сгенерировать';
                
                if (result.error === 'Insufficient balance') {
                    tg.showAlert(`Недостаточно средств!\n\nНужно: ${result.price} ₽\nБаланс: ${result.balance} ₽`);
                } else {
                    tg.showAlert(`Ошибка: ${result.error}`);
                }
                return;
            }
            
            currentJobId = result.job_id;
            navigate(() => renderGenerating(modelId, result.job_id));
        }
        
        async function handleImageSelect(input) {
            const file = input.files[0];
            if (!file) return;
            
            if (file.size > 10 * 1024 * 1024) {
                tg.showAlert('Файл слишком большой. Максимум 10MB.');
                return;
            }
            
            const preview = document.getElementById('imagePreview');
            const placeholder = document.getElementById('uploadPlaceholder');
            const uploadArea = document.getElementById('imageUploadArea');
            
            // Show loading
            placeholder.innerHTML = '<div class="loading-spinner" style="width: 30px; height: 30px;"></div><div style="margin-top: 12px;">Загрузка...</div>';
            
            try {
                // Read file as base64
                const base64 = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
                
                // Upload to server
                const result = await apiCall('/upload', {
                    method: 'POST',
                    body: JSON.stringify({ image: base64 })
                });
                
                if (result.error) {
                    throw new Error(result.error);
                }
                
                // Store URL and show preview
                appData.uploadedImageUrl = result.url;
                preview.src = base64;
                preview.style.display = 'block';
                placeholder.style.display = 'none';
                uploadArea.style.padding = '0';
                uploadArea.style.background = 'transparent';
                
            } catch (e) {
                tg.showAlert('Ошибка загрузки: ' + e.message);
                placeholder.innerHTML = `
                    <div style="font-size: 48px; margin-bottom: 12px;">📷</div>
                    <div>Нажмите чтобы выбрать фото</div>
                `;
            }
        }
        
        async function submitGeneration(event, modelId, requiresImage = false) {
            event.preventDefault();
            
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) {
                tg.showAlert('Введите описание для генерации');
                return;
            }
            
            // Check if image is required but not uploaded
            if (requiresImage && !appData.uploadedImageUrl) {
                tg.showAlert('Загрузите изображение для этой модели');
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Отправка...';
            
            const payload = {
                model_id: modelId,
                prompt: prompt,
                params: {}
            };
            
            // Add image URL if uploaded
            if (appData.uploadedImageUrl) {
                payload.image_url = appData.uploadedImageUrl;
            }
            
            const result = await apiCall('/generate', {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            
            if (result.error) {
                submitBtn.disabled = false;
                submitBtn.textContent = '✨ Сгенерировать';
                
                if (result.error === 'Insufficient balance') {
                    tg.showAlert(`Недостаточно средств!\n\nНужно: ${result.price} ₽\nБаланс: ${result.balance} ₽`);
                } else {
                    tg.showAlert(`Ошибка: ${result.error}`);
                }
                return;
            }
            
            currentJobId = result.job_id;
            navigate(() => renderGenerating(modelId, result.job_id));
        }
        
        function renderGenerating(modelId, jobId) {
            const app = document.getElementById('app');
            
            app.innerHTML = `
                <div class="status-card">
                    <div class="status-spinner"></div>
                    <div class="status-title" id="genStatusTitle">📤 Отправка на сервер...</div>
                    <div class="status-text" id="genStatusText">Подключаемся к серверу генерации</div>
                    <div style="margin-top: 12px; padding: 8px 16px; background: rgba(0,200,100,0.1); border-radius: 8px; font-size: 13px;" id="genStatusInfo">
                        ⏳ Ожидание ответа от провайдера
                    </div>
                    <div style="margin-top: 16px; padding: 12px 16px; background: rgba(100,100,255,0.1); border-radius: 8px; font-size: 13px; color: var(--tg-theme-hint-color);">
                        💡 Можете приступить к другим генерациям — результат отслеживайте в разделе <b>История</b>
                    </div>
                    <div style="margin-top: 12px; font-size: 11px; color: var(--tg-theme-hint-color); opacity: 0.7;">
                        ID: ${jobId}
                    </div>
                </div>
            `;
            
            // Start polling
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(() => pollJobStatus(jobId), 3000);
            
            // Also poll immediately after 1s
            setTimeout(() => pollJobStatus(jobId), 1000);
        }
        
        async function pollJobStatus(jobId) {
            const result = await apiCall(`/jobs/${jobId}`);
            console.log('pollJobStatus:', jobId, result);
            
            // Update status UI based on response
            const titleEl = document.getElementById('genStatusTitle');
            const textEl = document.getElementById('genStatusText');
            const infoEl = document.getElementById('genStatusInfo');
            
            // Handle network/parsing errors
            if (result.error && result.error !== 'Job not found') {
                console.warn('Poll error:', result.error);
                // Don't show error UI yet - might be temporary, keep polling
                return;
            }
            
            // Job not found yet - still creating, keep polling
            if (result.error === 'Job not found') {
                if (titleEl) titleEl.textContent = '📤 Создаём задачу...';
                if (textEl) textEl.textContent = 'Подождите, задача создаётся';
                return;
            }
            
            // Update UI based on status
            if (result.status === 'pending' || result.status === 'queued') {
                if (titleEl) titleEl.textContent = '📥 Запрос в очереди';
                if (textEl) textEl.textContent = 'Ваш запрос получен и ожидает обработки';
                if (infoEl) {
                    infoEl.style.background = 'rgba(255,200,0,0.1)';
                    infoEl.textContent = '🔄 Провайдер получил запрос, ожидаем начала генерации';
                }
            } else if (result.status === 'processing' || result.status === 'waiting') {
                if (titleEl) titleEl.textContent = '🎨 Генерация...';
                if (textEl) textEl.textContent = 'Нейросеть обрабатывает ваш запрос';
                if (infoEl) {
                    infoEl.style.background = 'rgba(0,150,255,0.1)';
                    infoEl.textContent = '✅ Провайдер работает! Это может занять 10 сек - 5 мин';
                }
            }
            
            if (result.status === 'completed' || result.status === 'success' || result.status === 'delivered') {
                if (pollInterval) clearInterval(pollInterval);
                renderResult(result);
            } else if (result.status === 'failed') {
                if (pollInterval) clearInterval(pollInterval);
                // Parse error for user-friendly message
                const errorMsg = parseErrorMessage(result.error || result.error_message || 'Генерация не удалась');
                renderError(errorMsg);
            }
            // If pending, continue polling
        }
        
        function parseErrorMessage(error) {
            const errorLower = (error || '').toLowerCase();
            if (errorLower.includes('timeout')) {
                return '⏱️ Время ожидания истекло. Провайдер не успел обработать запрос. Попробуйте ещё раз.';
            }
            if (errorLower.includes('insufficient') || errorLower.includes('balance')) {
                return '💳 Недостаточно средств на балансе. Пополните баланс и попробуйте снова.';
            }
            if (errorLower.includes('rate limit') || errorLower.includes('429')) {
                return '🚫 Слишком много запросов. Подождите минуту и попробуйте снова.';
            }
            if (errorLower.includes('model') && errorLower.includes('not found')) {
                return '🔍 Модель временно недоступна. Попробуйте другую модель.';
            }
            if (errorLower.includes('invalid') || errorLower.includes('validation')) {
                return '⚠️ Неверные параметры запроса. Проверьте введённые данные.';
            }
            if (errorLower.includes('circuit') || errorLower.includes('unavailable')) {
                return '🔧 Провайдер временно недоступен. Попробуйте через несколько минут.';
            }
            return error || 'Произошла ошибка при генерации. Попробуйте ещё раз.';
        }
        
        function renderResult(job) {
            const app = document.getElementById('app');
            const isVideo = job.result_url && (job.result_url.includes('.mp4') || job.result_url.includes('video'));
            
            app.innerHTML = `
                <div class="page-header">
                    <button class="back-btn" onclick="goHome()">←</button>
                    <div class="page-title">✨ Результат</div>
                </div>
                
                <div class="result-card">
                    ${isVideo ? `
                        <video class="result-video" src="${job.result_url}" controls autoplay loop></video>
                    ` : `
                        <img class="result-image" src="${job.result_url}" alt="Result" />
                    `}
                </div>
                
                <button class="btn" onclick="window.open('${job.result_url}', '_blank')">
                    📥 Скачать
                </button>
                <button class="btn btn-secondary" onclick="goHome()">
                    🏠 На главную
                </button>
            `;
        }
        
        function renderError(errorMsg) {
            const app = document.getElementById('app');
            
            app.innerHTML = `
                <div class="page-header">
                    <button class="back-btn" onclick="goHome()">←</button>
                    <div class="page-title">Ошибка</div>
                </div>
                
                <div class="error-card">
                    <div class="error-icon">😔</div>
                    <div class="error-title">Генерация не удалась</div>
                    <div class="error-text">${errorMsg}</div>
                </div>
                
                <button class="btn" onclick="goBack()">
                    🔄 Попробовать снова
                </button>
                <button class="btn btn-secondary" onclick="goHome()">
                    🏠 На главную
                </button>
            `;
        }
        
        function showHistory() {
            updateNav(3);
            navigate(renderHistory);
        }
        
        async function renderHistory() {
            const app = document.getElementById('app');
            
            app.innerHTML = `
                <div class="page-header">
                    <div class="page-title">📋 История генераций</div>
                </div>
                <div class="loading">
                    <div class="loading-spinner"></div>
                </div>
            `;
            
            const result = await apiCall(`/user/${appData.user.id}/history`);
            const history = result.history || [];
            
            if (history.length === 0) {
                app.innerHTML = `
                    <div class="page-header">
                        <div class="page-title">📋 История генераций</div>
                    </div>
                    <div class="error-card">
                        <div class="error-icon">📭</div>
                        <div class="error-title">Пока пусто</div>
                        <div class="error-text">Ваши генерации появятся здесь</div>
                    </div>
                    <button class="btn" onclick="showCategories()">
                        🎨 Создать генерацию
                    </button>
                `;
                return;
            }
            
            app.innerHTML = `
                <div class="page-header">
                    <div class="page-title">📋 История генераций</div>
                </div>
                ${history.map(h => {
                    let statusText = '⏳ В процессе';
                    let statusClass = '';
                    if (h.result_url) {
                        statusText = '✅ Готово';
                    } else if (h.status === 'failed' || h.error) {
                        const errorMsg = h.error_message || h.error || '';
                        const shortError = errorMsg.length > 50 ? errorMsg.slice(0, 50) + '...' : errorMsg;
                        statusText = '❌ ' + (shortError || 'Ошибка');
                        statusClass = 'color: #ff6b6b;';
                    }
                    return `
                    <div class="history-item" onclick="${h.result_url ? `window.open('${h.result_url}', '_blank')` : ''}">
                        ${h.result_url ? `<img class="history-thumb" src="${h.result_url}" />` : '<div class="history-thumb"></div>'}
                        <div class="history-info">
                            <div class="history-model">${h.model_id || 'Неизвестно'}</div>
                            <div class="history-status" style="${statusClass}">${statusText}</div>
                            <div class="history-date">${h.created_at || ''}</div>
                        </div>
                    </div>
                `}).join('')}
            `;
        }
        
        function openBot() {
            // Switch to bot chat - tg.switchInlineQuery opens bot in current chat
            // For top-up, just close Mini App - user is already in bot chat
            tg.close();
        }
        
        // Cleanup on close
        tg.onEvent('viewportChanged', () => {
            if (tg.viewportHeight === 0 && pollInterval) {
                clearInterval(pollInterval);
            }
        });
        
        loadApp();
    </script>
</body>
</html>
