<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TRT Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #999999;
            --tg-theme-link-color: #2481cc;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-secondary-bg-color: #f0f0f0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            min-height: 100vh;
            padding: 16px;
        }
        
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .header .subtitle {
            color: var(--tg-theme-hint-color);
            font-size: 14px;
        }
        
        .card {
            background: var(--tg-theme-secondary-bg-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .card-title {
            font-size: 14px;
            color: var(--tg-theme-hint-color);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .card-value {
            font-size: 32px;
            font-weight: 600;
        }
        
        .card-value .currency {
            font-size: 18px;
            color: var(--tg-theme-hint-color);
        }
        
        .models-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .model-card {
            background: var(--tg-theme-secondary-bg-color);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        
        .model-card:active {
            transform: scale(0.95);
            opacity: 0.8;
        }
        
        .model-emoji {
            font-size: 32px;
            margin-bottom: 8px;
        }
        
        .model-name {
            font-size: 12px;
            font-weight: 500;
            word-break: break-word;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            margin-top: 24px;
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 24px;
        }
        
        .btn:active {
            opacity: 0.8;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--tg-theme-hint-color);
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--tg-theme-button-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--tg-theme-button-text-color);
            font-size: 20px;
            font-weight: 600;
        }
        
        .user-name {
            font-size: 18px;
            font-weight: 600;
        }
        
        .user-username {
            font-size: 14px;
            color: var(--tg-theme-hint-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="app">
            <div class="loading">Загрузка...</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        const API_BASE = '/webapp/api';
        
        function getInitData() {
            return tg.initData || '';
        }
        
        async function apiCall(endpoint) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    headers: {
                        'X-Telegram-Init-Data': getInitData()
                    }
                });
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                return { error: error.message };
            }
        }
        
        function getUserFromTg() {
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                return tg.initDataUnsafe.user;
            }
            return null;
        }
        
        function getInitial(name) {
            return name ? name.charAt(0).toUpperCase() : '?';
        }
        
        async function loadApp() {
            const app = document.getElementById('app');
            const user = getUserFromTg();
            
            if (!user) {
                app.innerHTML = `
                    <div class="error">
                        ⚠️ Откройте приложение через Telegram
                    </div>
                `;
                return;
            }
            
            let balanceData = { balance: 0 };
            let modelsData = { models: [], count: 0 };
            
            try {
                [balanceData, modelsData] = await Promise.all([
                    apiCall(`/user/${user.id}/balance`),
                    apiCall('/models')
                ]);
            } catch (e) {
                console.error('Load error:', e);
            }
            
            const modelCards = (modelsData.models || []).slice(0, 8).map(model => `
                <div class="model-card" onclick="selectModel('${model.id}')">
                    <div class="model-emoji">${model.emoji || '🎨'}</div>
                    <div class="model-name">${model.name || model.id}</div>
                </div>
            `).join('');
            
            app.innerHTML = `
                <div class="user-info">
                    <div class="user-avatar">${getInitial(user.first_name)}</div>
                    <div>
                        <div class="user-name">${user.first_name} ${user.last_name || ''}</div>
                        <div class="user-username">@${user.username || 'user'}</div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-title">💰 Баланс</div>
                    <div class="card-value">
                        ${(balanceData.balance || 0).toFixed(2)}
                        <span class="currency">₽</span>
                    </div>
                </div>
                
                <div class="section-title">🎨 Модели (${modelsData.count || 0})</div>
                <div class="models-grid">
                    ${modelCards || '<div class="loading">Нет моделей</div>'}
                </div>
                
                <button class="btn" onclick="openBot()">
                    🤖 Открыть бота
                </button>
            `;
        }
        
        function selectModel(modelId) {
            tg.showAlert(`Модель: ${modelId}\n\nДля генерации откройте бота.`);
        }
        
        function openBot() {
            tg.close();
        }
        
        loadApp();
    </script>
</body>
</html>
